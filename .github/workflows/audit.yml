name: Audit

# Dependency-vulnerability scan for both ecosystems. Weekly + on demand, plus a
# check on dependency-manifest changes so a risky bump is caught in review.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"

jobs:
  npm-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  cargo-audit:
    runs-on: ubuntu-22.04
    # audit-check reports through a check run, and opens an issue per advisory
    # on scheduled runs; without these the job fails after a clean scan.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
