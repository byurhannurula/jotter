name: CI

# Fast gates on every push/PR. The Rust suite runs here on Linux only, with the
# cargo cache: macOS is billed at 10x and Windows is slow, so those two are left
# to release.yml, where all three OSes run everything. `pnpm release` also gates
# on `cargo test` locally before it tags. Develop on `dev`; `main` is
# release/deploy-ready.
on:
  push:
    branches: [main, dev]
  pull_request:

# On rapid pushes to the same branch/PR, cancel the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Formatting is enforced by a pre-commit hook, but a hook can be skipped
      # and a PR can come from anywhere, so the gate is repeated here.
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
