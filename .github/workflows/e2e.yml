name: E2E

# The real app under WebdriverIO on all three OSes, started by hand or by the
# nightly schedule rather than on every push (macOS is billed at 10x, and a
# debug build plus three launches takes minutes). The binary is built with the
# `e2e` Cargo feature, which release.yml never passes.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:build
      # The embedded driver is auto-detected on macOS only; elsewhere the
      # service needs the port spelled out. Linux has no display on a runner.
      - name: Run the suite
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm e2e
        env:
          TAURI_WEBDRIVER_PORT: "4445"
      - name: Run the suite
        if: runner.os != 'Linux'
        run: pnpm e2e
        env:
          TAURI_WEBDRIVER_PORT: "4445"
      - name: Keep screenshots and logs from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.os }}
          path: e2e/logs
          if-no-files-found: ignore
